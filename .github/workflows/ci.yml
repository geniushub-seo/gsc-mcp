name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy drift check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # .golangci.yml uses version: "2". The linter binary must be built with a
      # Go toolchain >= go.mod (1.26.x); older v2.1.x binaries fail to load config.
      # "no go files to analyze" is a package-loader / cwd error (./... from a
      # directory with no Go files), not a reason to skip this step.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: ./...
          working-directory: .
